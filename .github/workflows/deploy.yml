# Keep production env in sync after Railway's GitHub auto-deploy.
# Required secrets: RAILWAY_TOKEN, RAILWAY_SERVICE_ID — see DEPLOYMENT.md
#
# Railway already builds the monolith from this repo (/railway.toml + /Dockerfile).
# Do not `railway up` from Actions — it races the GitHub deploy and can 524.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Railway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Railway secrets
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
        run: |
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "::error::RAILWAY_TOKEN is not set. Railway → Project → Settings → Tokens → project token."
            exit 1
          fi
          if [ -z "${RAILWAY_SERVICE_ID:-}" ]; then
            echo "::error::RAILWAY_SERVICE_ID is not set."
            exit 1
          fi

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Sync Stripe billing variables
        continue-on-error: true
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: |
          if [ -z "${STRIPE_SECRET_KEY:-}" ] || [ -z "${STRIPE_WEBHOOK_SECRET:-}" ]; then
            echo "STRIPE_SECRET_KEY / STRIPE_WEBHOOK_SECRET GitHub secrets not set; skipping Railway Stripe sync."
            exit 0
          fi
          railway variable set \
            "STRIPE_MODE=live" \
            "STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}" \
            "STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}" \
            "STRIPE_PRICE_MONTHLY=price_1UDycl7916C3OAmE5bi5arRn" \
            "STRIPE_PRICE_YEARLY=price_1UDycm7916C3OAmEozHX6ini" \
            "STRIPE_PRICE_VERIFIED_BADGE=price_1UDycw7916C3OAmEQICZf0D6" \
            "STRIPE_PRICE_FEATURED_PLACEMENT=price_1UDycw7916C3OAmEgDDwytP9" \
            --service "${RAILWAY_SERVICE_ID}"

      - name: Sync Resend email variables
        continue-on-error: true
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -z "${RESEND_API_KEY:-}" ]; then
            echo "RESEND_API_KEY GitHub secret not set; skipping Railway Resend sync."
            exit 0
          fi
          railway variable set \
            "RESEND_API_KEY=${RESEND_API_KEY}" \
            "EMAIL_FROM=Struggling With Addiction <noreply@strugglingwithaddiction.com>" \
            --service "${RAILWAY_SERVICE_ID}"

      # Railway already builds from the GitHub repo on push. A second
      # `railway up --detach` races that deploy, cancels it, and can leave
      # Cloudflare with no healthy origin (524).
      - name: Wait for Railway origin
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
        run: |
          for i in $(seq 1 40); do
            code=$(curl -sS -o /tmp/health.json -w "%{http_code}" -m 15 https://strugglingwithaddiction.com/health || true)
            if [ "$code" = "200" ] && grep -q '"status":"ok"' /tmp/health.json; then
              echo "Origin healthy"
              cat /tmp/health.json
              exit 0
            fi
            echo "waiting ($i) HTTP ${code:-000}"
            sleep 15
          done
          echo "::error::Origin did not become healthy. Recent Railway logs:"
          railway logs --latest --lines 80 \
            --project 407fa40d-6608-4441-905c-f3fab0182421 \
            --environment production \
            --service "${RAILWAY_SERVICE_ID}" || true
          exit 1

      - name: Wipe email logs, finance invoices, and analytics
        continue-on-error: true
        working-directory: backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
        run: |
          pip install -q -r requirements.txt
          railway run --service "${RAILWAY_SERVICE_ID}" python scripts/wipe_ops_data.py
