<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SWA Studio</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('swa-admin-theme')
          if (t !== 'light' && t !== 'dark') t = 'light'
          document.documentElement.setAttribute('data-theme', t)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
    <script>
      (function () {
        try {
          var data = null
          var name = window.name || ''
          if (name.indexOf('swa-auth:') === 0) {
            try { data = JSON.parse(name.slice(9)) } catch (e) {}
            window.name = ''
          }
          var hash = location.hash || ''
          if (!data && hash.indexOf('#swa-auth=') === 0) {
            var raw = hash.slice(10).replace(/ /g, '+')
            try { raw = decodeURIComponent(raw) } catch (e) {}
            raw = raw.replace(/-/g, '+').replace(/_/g, '/')
            while (raw.length % 4) raw += '='
            data = JSON.parse(atob(raw))
          }
          if (hash.indexOf('#swa-auth=') === 0) {
            history.replaceState(null, '', location.pathname + location.search)
          }
          if (data && data.access_token && data.refresh_token && data.role) {
            localStorage.setItem('access_token', data.access_token)
            localStorage.setItem('refresh_token', data.refresh_token)
            localStorage.setItem('role', data.role)
          }
        } catch (e) {}
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=PT+Sans:wght@400;700&family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
